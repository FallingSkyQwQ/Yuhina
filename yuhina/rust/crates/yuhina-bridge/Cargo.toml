[package]
name = "yuhina-bridge"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yuhina-api = { path = "../yuhina-api" }
yuhina-db = { path = "../yuhina-db" }
yuhina-core = { path = "../yuhina-core" }
yuhina-download = { path = "../yuhina-download" }
yuhina-instance = { path = "../yuhina-instance" }
yuhina-auth = { path = "../yuhina-auth" }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
flutter_rust_bridge= "=2.13.0"

# The `frb` proc-macro emits `#[cfg(frb_expand)]` for codegen expansion; declare
# it so normal builds (and `clippy -D warnings`) treat it as expected.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(frb_expand)"] }

[dev-dependencies]
